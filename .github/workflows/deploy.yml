name: Deploy Portfolio to GitHub Pages

# This tells the robot to run every time you push to the 'main' branch
on:
  push:
    branches: ["main"]

# Grants permissions to upload the files to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Setup Node.js (The oven)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the React/TypeScript app
        run: npm run build

      - name: Upload the finished website
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # This is the folder Vite creates when it builds

      - name: Deploy to GitHub web!
        id: deployment
        uses: actions/deploy-pages@v4